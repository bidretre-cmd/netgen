[project]
name = "netflix-webapp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask==3.0.3",
    "flask-sqlalchemy==3.1.1",
    "flask-login==0.6.3",
    "flask-wtf==1.2.1",
    "werkzeug==3.0.3",
    "pyyaml==6.0.1",
    "requests==2.31.0",
    "urllib3==2.0.7",
    "gunicorn==21.2.0",
    "pysocks==1.7.1"
]

[tool.vercel]
entrypoint = "run:app"
